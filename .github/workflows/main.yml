name: Build Dino Hayoti APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: O'yin kodini olish
        uses: actions/checkout@v4

      - name: Java o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK o'rnatish
        uses: android-actions/setup-android@v3

      - name: Gradle o'rnatish
        uses: gradle/actions/setup-gradle@v4

      - name: Android loyihasini tayyorlash
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/dinohayoti/game

          cp index.html app/src/main/assets/index.html

          echo "include ':app'" > settings.gradle
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DinoHayoti"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.dinohayoti.game'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.dinohayoti.game'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Dino Hayoti 3D">
                  <activity android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/dinohayoti/game/MainActivity.java <<'EOF'
          package com.dinohayoti.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.view.View;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().getDecorView().setSystemUiVisibility(5894 | 1024 | 512);
                  WebView w = new WebView(this);
                  WebSettings s = w.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  w.setWebChromeClient(new android.webkit.WebChromeClient());
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: APK yig'ish
        run: gradle assembleDebug

      - name: APK faylini saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Dino-Hayoti-APK
          path: app/build/outputs/apk/debug/app-debug.apk
